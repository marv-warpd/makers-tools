<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Montserrat, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#292d34"/></marker>
    <marker id="av" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8833fd"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8833fd" flood-opacity=".14"/></filter>
    <style>
      .lane{fill:#f3eefc}.lane2{fill:#eef9fc}
      .box{fill:#fff;stroke:#8833fd;stroke-width:1.6;filter:url(#sh)}
      .svc{fill:#fff;stroke:#22b8d8;stroke-width:1.8;filter:url(#sh)}
      .kv{fill:#fff;stroke:#22b8d8;stroke-width:1.8;stroke-dasharray:5 4}
      .t{font-size:16px;font-weight:700;fill:#1b1b22;text-anchor:middle}
      .s{font-size:12px;font-weight:500;fill:#57535f;text-anchor:middle}
      .lab{font-size:15px;font-weight:800;fill:#1b1b22}
      .sub{font-size:12px;font-weight:500;fill:#6b6577}
      .flow{fill:none;stroke:#292d34;stroke-width:1.8;marker-end:url(#a)}
      .call{fill:none;stroke:#8833fd;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#av)}
      .pill{font-size:11.5px;font-weight:600;fill:#4a4556;text-anchor:middle}
      .pillbg{fill:#fff;stroke:#e9e2fb;stroke-width:1;rx:9}
      .hd{font-size:13px;font-weight:800;fill:#8833fd;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>

  <!-- ClickUp lane -->
  <rect x="40" y="70" width="1320" height="250" rx="18" class="lane"/>
  <text x="64" y="106" class="lab">ClickUp</text>
  <text x="64" y="126" class="sub">The work and its history</text>

  <!-- boxes -->
  <g>
    <rect x="150" y="150" width="230" height="86" rx="12" class="box"/>
    <text x="265" y="186" class="t">Form and Intake</text>
    <text x="265" y="208" class="s">Scope, delivery and final review</text>

    <rect x="450" y="150" width="230" height="86" rx="12" class="box"/>
    <text x="565" y="186" class="t">Projects</text>
    <text x="565" y="208" class="s">Delivery steps, time and costs</text>

    <rect x="750" y="150" width="200" height="86" rx="12" class="box"/>
    <text x="850" y="186" class="t">Supplier briefs</text>
    <text x="850" y="208" class="s">Internal staging</text>

    <rect x="1020" y="150" width="230" height="86" rx="12" class="box"/>
    <text x="1135" y="186" class="t">Design Agency List</text>
    <text x="1135" y="208" class="s">Released briefs, proofs and files</text>

    <rect x="450" y="262" width="230" height="46" rx="12" class="box"/>
    <text x="565" y="291" class="t">Clients and reporting</text>
  </g>

  <!-- workflow arrows -->
  <path d="M380,193 L448,193" class="flow"/>
  <path d="M680,193 L748,193" class="flow"/>
  <path d="M950,193 L1018,193" class="flow"/>
  <path d="M1135,236 C1135,330 760,330 700,236 L682,216" class="flow"/>
  <path d="M565,236 L565,260" class="flow"/>

  <!-- arrow labels -->
  <g>
    <rect x="358" y="130" width="112" height="18" class="pillbg"/><text x="414" y="143" class="pill">approved request</text>
    <rect x="660" y="130" width="108" height="18" class="pillbg"/><text x="714" y="143" class="pill">design step ready</text>
    <rect x="922" y="130" width="126" height="18" class="pillbg"/><text x="985" y="143" class="pill">creative lead releases</text>
    <rect x="840" y="290" width="200" height="18" class="pillbg"/><text x="940" y="303" class="pill">accepted final files return to the job</text>
  </g>

  <!-- Cloudflare lane -->
  <rect x="40" y="440" width="1320" height="220" rx="18" class="lane2"/>
  <text x="64" y="476" class="lab">Cloudflare</text>
  <text x="64" y="496" class="sub">Custom MCP server</text>
  <text x="64" y="512" class="sub">+ API services</text>

  <g>
    <rect x="150" y="520" width="280" height="96" rx="12" class="svc"/>
    <text x="290" y="556" class="t">Event service</text>
    <text x="290" y="578" class="s">makers-approval</text>
    <text x="290" y="596" class="s">Intake, approval and revision events</text>

    <rect x="540" y="520" width="340" height="96" rx="12" class="svc"/>
    <text x="710" y="552" class="t">MCP tools server</text>
    <text x="710" y="574" class="s">makers-tools · 20 reads, 6 bounded writes</text>
    <text x="710" y="594" class="s">Calculations, controlled writes, weekly client refresh</text>

    <rect x="1020" y="534" width="230" height="68" rx="12" class="kv"/>
    <text x="1135" y="562" class="t">Stored fix proposals</text>
    <text x="1135" y="584" class="s">Workers KV · Fix ref, 14 days</text>
  </g>

  <path d="M430,568 L538,568" class="flow"/>
  <rect x="434" y="540" width="100" height="18" class="pillbg"/><text x="484" y="553" class="pill">service binding</text>
  <path d="M880,568 L1018,568" class="flow"/>
  <rect x="900" y="540" width="98" height="18" class="pillbg"/><text x="949" y="553" class="pill">fix references</text>

  <!-- calls between the lanes -->
  <path d="M220,320 L220,518" class="call"/>
  <rect x="120" y="362" width="200" height="34" class="pillbg"/>
  <text x="220" y="376" class="pill">automation webhooks</text><text x="220" y="390" class="pill">ClickUp to the event service</text>

  <path d="M360,518 L360,322" class="call"/>
  <rect x="280" y="418" width="160" height="18" class="pillbg"/><text x="360" y="431" class="pill">closes intake stages via API</text>

  <path d="M620,320 L620,518" class="call"/>
  <rect x="520" y="362" width="200" height="34" class="pillbg"/>
  <text x="620" y="376" class="pill">agent and Brain tool calls</text><text x="620" y="390" class="pill">over MCP</text>

  <path d="M800,518 L800,322" class="call"/>
  <rect x="705" y="410" width="190" height="34" class="pillbg"/>
  <text x="800" y="424" class="pill">ClickUp API reads</text><text x="800" y="438" class="pill">and bounded writes</text>

  <!-- legend -->
  <g font-size="12" fill="#57535f" font-weight="500">
    <line x1="64" y1="712" x2="104" y2="712" stroke="#292d34" stroke-width="1.8"/><text x="112" y="716">Workflow and reporting inputs</text>
    <line x1="330" y1="712" x2="370" y2="712" stroke="#8833fd" stroke-width="1.8" stroke-dasharray="6 5"/><text x="378" y="716">Calls between ClickUp and the services</text>
    <rect x="640" y="704" width="30" height="16" rx="4" fill="#fff" stroke="#8833fd" stroke-width="1.4"/><text x="678" y="716">ClickUp Lists</text>
    <rect x="790" y="704" width="30" height="16" rx="4" fill="#fff" stroke="#22b8d8" stroke-width="1.6"/><text x="828" y="716">Custom integration</text>
  </g>
</svg>
